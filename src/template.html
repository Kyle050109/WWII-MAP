/* map layers */

<script>
(function () {
'use strict';
const D = window.WW2, G = window.WW2GEO;

// ---------- i18n ----------
const T = {
  zh: {
    eyebrow: '第二次世界大战 · 欧洲战场', title: '烽火欧陆', subtitle: '1939—1945 欧洲战场互动地图：拖动时间轴，看战线推移、攻势展开与重大事件。',
    more: '详情', less: '收起', evhead: '本阶段大事', layers: '图层', legend: '控制区', asof: '截至 ',
    ly_arrows: '攻势箭头', ly_events: '事件标记', ly_fronts: '战线', ly_ghost: '上一阶段战线', ly_cities: '城市', ly_labels: '国家与海域名', ly_rivers: '河流湖泊', ly_allev: '显示全部已发生事件',
    k_front: '当前战线', k_ghost: '上一阶段战线', prev: '‹ 上一事件', next: '下一事件 ›', play: '播放', pause: '暂停',
    day: (n) => `战争第 <b>${n}</b> 天`, dayEnd: '欧战结束',
    phaseK: (i, a, b) => `第 ${i} 阶段 · ${a} — ${b}`,
    types: { battle: '战役', air: '空战与轰炸', naval: '海战', political: '政治', uprising: '起义', atrocity: '暴行与纪念' },
    disclaimer: '控制区与战线为示意性近似，按时间快照绘制，并非精确测绘边界。国界以1938年为底图。',
    hint: '空格 播放 · ← → 切换事件 · Shift+← → 跳一个月',
    md: (d) => `${d.getUTCMonth() + 1}月${d.getUTCDate()}日`, full: (d) => `${d.getUTCFullYear()}年${d.getUTCMonth() + 1}月${d.getUTCDate()}日`,
    short: (d) => `${d.getUTCFullYear()}.${String(d.getUTCMonth() + 1).padStart(2, '0')}.${String(d.getUTCDate()).padStart(2, '0')}`,
    ym: (d) => `${d.getUTCFullYear()}.${d.getUTCMonth() + 1}`
  },
  en: {
    eyebrow: 'Second World War · European Theatre', title: 'Europe Ablaze', subtitle: 'An interactive map of the war in Europe, 1939–1945. Drag the timeline to watch fronts move, offensives unfold and key events happen.',
    more: 'More', less: 'Less', evhead: 'Key events this phase', layers: 'Layers', legend: 'Control', asof: 'as of ',
    ly_arrows: 'Offensives', ly_events: 'Events', ly_fronts: 'Front lines', ly_ghost: 'Previous front', ly_cities: 'Cities', ly_labels: 'Country & sea names', ly_rivers: 'Rivers & lakes', ly_allev: 'Show all past events',
    k_front: 'Front line', k_ghost: 'Previous front', prev: '‹ Previous', next: 'Next ›', play: 'Play', pause: 'Pause',
    day: (n) => `Day <b>${n}</b> of the war`, dayEnd: 'War in Europe over',
    phaseK: (i, a, b) => `Phase ${i} · ${a} — ${b}`,
    types: { battle: 'Battle', air: 'Air war', naval: 'Naval', political: 'Politics', uprising: 'Uprising', atrocity: 'Atrocity & memory' },
    disclaimer: 'Areas of control and front lines are schematic approximations drawn as dated snapshots, not surveyed borders. Base map uses 1938 frontiers.',
    hint: 'Space play · ← → events · Shift+← → one month',
    md: (d) => `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`, full: (d) => `${d.getUTCDate()} ${MONTHS_L[d.getUTCMonth()]} ${d.getUTCFullYear()}`,
    short: (d) => `${String(d.getUTCDate()).padStart(2, '0')} ${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`,
    ym: (d) => `${MONTHS[d.getUTCMonth()]} ${d.getUTCFullYear()}`
  }
};
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_L = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

// ---------- time ----------
const DAY = 864e5;
const T0 = Date.UTC(1939, 8, 1), T1 = Date.UTC(1945, 4, 8);
const NDAYS = Math.round((T1 - T0) / DAY);
const toDay = (s) => { const p = s.split('-').map(Number); return Math.round((Date.UTC(p[0], (p[1] || 1) - 1, p[2] || 1) - T0) / DAY); };
const toDate = (n) => new Date(T0 + n * DAY);
const snapDays = D.snaps.map(toDay);
D.events.forEach(e => e.day = toDay(e.date));
D.events.sort((a, b) => a.day - b.day);
D.arrows.forEach(a => { a.d0 = toDay(a.from); a.d1 = toDay(a.to); });
D.phases.forEach(p => { p.d0 = toDay(p.from); p.d1 = toDay(p.to); });

// ---------- state ----------
const st = { day: 0, lang: 'zh', snap: -1, playing: false, speed: 1, sel: null, k: 1, t: d3.zoomIdentity, focus: null };
try { const l = localStorage.getItem('ww2-lang'); if (l === 'en' || l === 'zh') st.lang = l; } catch (e) { /* storage unavailable */ }
const L = () => T[st.lang];
const nm = (o) => st.lang === 'zh' ? o.zh : o.en;

// ---------- svg scaffold ----------
const svg = d3.select('#map');
const defs = svg.append('defs');
const pat = defs.append('pattern').attr('id', 'hatch').attr('patternUnits', 'userSpaceOnUse').attr('width', 5).attr('height', 5).attr('patternTransform', 'rotate(45)');
pat.append('rect').attr('width', 5).attr('height', 5).style('fill', 'var(--s-occ)');
pat.append('line').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 5).style('stroke', 'var(--s-reich)').style('stroke-width', 1.5);
const root = svg.append('g').attr('class', 'root');
const gSea = root.append('rect').attr('class', 'sea');
const gGrat = root.append('path').attr('class', 'grat');
const gBase = root.append('g');
const gZones = root.append('g');
const gBorders = root.append('g');
const gWater = root.append('g');
const gGhost = root.append('g');
const gFront = root.append('g');
const over = svg.append('g').attr('class', 'over');
const gLabels = over.append('g').attr('class', 'ctry-labels');
const gArrows = over.append('g').attr('class', 'arrows');
const gCities = over.append('g').attr('class', 'cities');
const gEvents = over.append('g').attr('class', 'events');
const measure = defs.append('path');

let W = 0, H = 0, proj = null, pathCache = {};
const P = (ll) => proj(ll);
const ringD = (r) => 'M' + r.map(p => { const q = P(p); return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join('L') + 'Z';
const mpD = (mp) => mp.map(poly => poly.map(ringD).join('')).join('');
const lineD = (pts) => 'M' + pts.map(p => { const q = P(p); return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join('L');

function statusOf(id, day) {
  const b = D.base[id]; if (!b) return 'neu';
  let s = b[0][1];
  for (const [d, v] of b) { if (toDay(d.length === 4 ? d + '-01-01' : d) <= day) s = v; }
  return s;
}
function zonesFor(si) {
  const n = si + 1, out = [];
  D.staticZones.forEach(([a, b, z]) => { if (n >= a && n <= b) out.push(z); });
  (D.fronts[n] || []).forEach(z => out.push(z));
  return out.slice().sort((a, b) => a.o - b.o);
}
function resolveS(s, day) { return s[0] === '@' ? statusOf(s.slice(1), day) : s; }

// ---------- build geography ----------
function layout() {
  const r = document.getElementById('app').getBoundingClientRect();
  W = r.width; H = r.height;
  svg.attr('viewBox', `0 0 ${W} ${H}`);
  const narrow = W < 760;
  const panelW = narrow ? 0 : document.getElementById('panel').getBoundingClientRect().width + 32;
  const padL = narrow ? 10 : panelW, padR = narrow ? 10 : 20, padT = narrow ? 150 : 20, padB = narrow ? 130 : 100;
  proj = d3.geoConicConformal().parallels([38, 62]).rotate([-17, 0]);
  const fitBox = { type: 'MultiPoint', coordinates: [[-10.5, 36], [44, 36], [46.5, 44], [44, 62], [-10.5, 58], [28, 69.3], [2, 33.2], [20, 31.6], [10, 33.5]] };
  proj.fitExtent([[padL, padT], [Math.max(padL + 200, W - padR), Math.max(padT + 200, H - padB)]], fitBox);
  pathCache = {};
  for (const id in G.countries) pathCache[id] = mpD(G.countries[id].mp);
  gSea.attr('x', -W * 3).attr('y', -H * 3).attr('width', W * 7).attr('height', H * 7);
  // graticule
  let g = '';
  for (let lon = -30; lon <= 70; lon += 10) { const pts = []; for (let lat = 25; lat <= 80; lat += 1) pts.push([lon, lat]); g += lineD(pts); }
  for (let lat = 30; lat <= 75; lat += 10) { const pts = []; for (let lon = -30; lon <= 70; lon += 1) pts.push([lon, lat]); g += lineD(pts); }
  gGrat.attr('d', g);
  // clip paths
  defs.selectAll('clipPath').remove();
  const all = Object.keys(G.countries);
  defs.append('clipPath').attr('id', 'clip-land').append('path').attr('d', all.map(id => pathCache[id]).join(''));
  clipIds = {};
  // base countries
  gBase.selectAll('path').data(all, d => d).join('path').attr('class', 'ctry').attr('d', d => pathCache[d]).attr('fill-rule', 'evenodd')
    .on('pointermove', (ev, id) => tipShow(ev, G.countries[id].n[st.lang === 'zh' ? 0 : 1], statusLabel(statusOf(id, snapDays[st.snap])))).on('pointerleave', tipHide);
  gBorders.selectAll('path').data(all, d => d).join('path').attr('class', 'borderline').attr('d', d => pathCache[d]);
  // water
  gWater.selectAll('*').remove();
  gWater.append('path').attr('class', 'lake lake-n').attr('d', G.lakes.map(l => ringD(l.p)).join(''));
  gWater.append('path').attr('class', 'river').attr('d', G.rivers.filter(r => r.r <= 8).map(r => r.l.map(lineD).join('')).join(''));
  st.snap = -1;
  renderSnap(true);
  renderOverlay();
}
let clipIds = {};
function clipFor(ids) {
  const key = ids.slice().sort().join('-');
  if (!clipIds[key]) {
    clipIds[key] = 'clip-' + key;
    defs.append('clipPath').attr('id', clipIds[key]).append('path').attr('d', ids.map(id => pathCache[id] || '').join('')).attr('clip-rule', 'evenodd');
  }
  return clipIds[key];
}

function statusLabel(s) { return nm(D.statuses[s] || D.statuses.neu); }

function snapIndex(day) { let i = 0; for (let k = 0; k < snapDays.length; k++) if (snapDays[k] <= day) i = k; return i; }

function renderSnap(force) {
  const si = snapIndex(st.day);
  if (si === st.snap && !force) return;
  const prev = st.snap; st.snap = si;
  const sday = snapDays[si];
  gBase.selectAll('path.ctry').attr('class', id => 'ctry s-' + statusOf(id, sday)).attr('data-s', id => statusOf(id, sday));
  // zones: crossfade
  const zs = zonesFor(si);
  const old = gZones.selectAll('g.zset');
  old.interrupt().transition().duration(force ? 0 : 450).style('opacity', 0).remove();
  const ng = gZones.append('g').attr('class', 'zset').style('opacity', force ? 1 : 0);
  zs.forEach(z => {
    const s = resolveS(z.s, sday);
    ng.append('path').attr('class', 'zone s-' + s).attr('data-s', s).attr('d', ringD(z.p)).attr('clip-path', `url(#${clipFor(z.w)})`)
      .on('pointermove', (ev) => tipShow(ev, z.n ? z.n[st.lang === 'zh' ? 0 : 1] : statusLabel(s), z.n ? statusLabel(s) : ''))
      .on('pointerleave', tipHide);
  });
  if (!force) ng.transition().duration(450).style('opacity', 1);
  // fronts
  const fl = zs.filter(z => z.line);
  gFront.selectAll('*').remove();
  fl.forEach(z => { gFront.append('path').attr('class', 'front-halo').attr('d', lineD(z.line)).attr('clip-path', `url(#${clipFor(z.w)})`); });
  fl.forEach(z => { gFront.append('path').attr('class', 'front').attr('d', lineD(z.line)).attr('clip-path', `url(#${clipFor(z.w)})`); });
  gGhost.selectAll('*').remove();
  if (si > 0) {
    const pz = (D.fronts[si] || []).filter(z => z.line);
    pz.forEach(z => gGhost.append('path').attr('class', 'ghost').attr('d', lineD(z.line)).attr('clip-path', `url(#${clipFor(z.w)})`));
  }
  applyFocus();
  document.getElementById('asof').textContent = L().asof + L().short(toDate(sday));
}

// ---------- overlay (screen-space) ----------
const tx = (ll) => st.t.apply(P(ll));
function renderOverlay() {
  renderLabels(); renderCities(); renderArrows(); renderEvents();
}
function renderLabels() {
  const k = st.t.k;
  const data = [];
  const MINOR = { NLD: 1, BEL: 1, LTU: 1, LVA: 1, EST: 1, DNK: 1, ALB: 1, CHE: 1, CSK: .1, IRL: .1 };
  for (const id in D.countryLabels) if (!MINOR[id] || k >= 2.2 || (MINOR[id] < 1 && st.lang === 'zh')) data.push({ id, ll: D.countryLabels[id], txt: G.countries[id] ? G.countries[id].n[st.lang === 'zh' ? 0 : 1] : '', k: 'ctry' });
  D.labels.forEach(l => data.push({ id: l.en, ll: l.ll, txt: nm(l), k: 'sea' }));
  const show = k < 4.5;
  gLabels.selectAll('text').data(show ? data : [], d => d.id).join('text')
    .attr('class', d => 'lbl ' + (d.k === 'sea' ? 'lbl-sea' : 'lbl-ctry')).attr('text-anchor', 'middle')
    .attr('transform', d => { const p = tx(d.ll); return `translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`; })
    .text(d => d.txt);
}
function renderCities() {
  const k = st.t.k;
  const m = W < 760 ? 1.6 : 1;
  const vis = D.cities.filter(c => c.r === 1 || (c.r === 2 && k >= 1.3 * m - .3) || (c.r === 3 && k >= 1.7 * m) || (c.r === 4 && k >= 2.8 * m));
  const sel = gCities.selectAll('g.city').data(vis, d => d.en);
  const en = sel.enter().append('g').attr('class', 'city');
  en.append('circle'); en.append('text').attr('class', 'lbl lbl-city').attr('dy', '0.35em');
  sel.exit().remove();
  const all = en.merge(sel);
  all.attr('transform', d => { const p = tx(d.ll); return `translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`; });
  all.select('circle').attr('r', d => d.r === 1 ? 3.6 : 2.6).attr('class', d => d.r === 1 ? 'city-cap' : 'city-dot');
  all.select('text').attr('x', 6).attr('class', d => 'lbl lbl-city' + (d.r === 1 ? ' r1' : '')).text(d => nm(d));
}
const lineGen = d3.line().curve(d3.curveCatmullRom.alpha(0.5));
function renderArrows() {
  const d = st.day;
  const vis = D.arrows.filter(a => d >= a.d0 && d <= a.d1 + 25);
  gArrows.selectAll('*').remove();
  const k = Math.min(1.6, Math.max(.8, Math.sqrt(st.t.k)));
  vis.forEach(a => {
    const pts = a.path.map(tx);
    measure.attr('d', lineGen(pts));
    const len = measure.node().getTotalLength();
    const prog = a.d1 > a.d0 ? Math.min(1, Math.max(.06, (d - a.d0) / (a.d1 - a.d0))) : 1;
    const fade = d > a.d1 ? Math.max(0, 1 - (d - a.d1) / 25) : 1;
    const L2 = len * prog, n = Math.max(2, Math.ceil(L2 / 5));
    const sp = []; for (let i = 0; i <= n; i++) { const q = measure.node().getPointAtLength(L2 * i / n); sp.push([q.x, q.y]); }
    const w = 5.5 * k, hl = 13 * k, hw = 8 * k;
    const tip = sp[sp.length - 1];
    let back = sp[0]; for (let i = sp.length - 1; i >= 0; i--) { if (Math.hypot(tip[0] - sp[i][0], tip[1] - sp[i][1]) >= hl) { back = sp[i]; break; } }
    const ang = Math.atan2(tip[1] - back[1], tip[0] - back[0]);
    const shaftEnd = [tip[0] - Math.cos(ang) * hl * .7, tip[1] - Math.sin(ang) * hl * .7];
    const shaft = sp.filter(p => Math.hypot(tip[0] - p[0], tip[1] - p[1]) >= hl * .7).concat([shaftEnd]);
    const g = gArrows.append('g').style('opacity', .92 * fade);
    const sd = 'M' + shaft.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L');
    g.append('path').attr('class', 'arrow-halo').attr('d', sd).style('stroke-width', w + 3.5);
    const head = [[tip[0], tip[1]], [tip[0] - Math.cos(ang) * hl + Math.cos(ang + Math.PI / 2) * hw, tip[1] - Math.sin(ang) * hl + Math.sin(ang + Math.PI / 2) * hw], [tip[0] - Math.cos(ang) * hl - Math.cos(ang + Math.PI / 2) * hw, tip[1] - Math.sin(ang) * hl - Math.sin(ang + Math.PI / 2) * hw]];
    const hd = 'M' + head.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L') + 'Z';
    g.append('path').attr('class', 'arrow-head-halo').attr('d', hd).style('fill', 'var(--halo)');
    g.append('path').attr('class', 'arrow-shaft side-' + a.side).attr('d', sd).style('stroke-width', w);
    g.append('path').attr('class', 'side-' + a.side).attr('d', hd).style('stroke-width', 0);
    const lbl = nm(a);
    if (lbl && prog > .25) {
      const mid = sp[Math.floor(sp.length * .45)];
      g.append('text').attr('class', 'arrow-lbl side-' + a.side).style('stroke', 'var(--halo)').attr('x', mid[0]).attr('y', mid[1] - 9).attr('text-anchor', 'middle').text(lbl);
    }
  });
}
const GLYPH = {
  battle: (g) => { g.append('path').attr('class', 'glyph-s').attr('d', 'M-3.6,-3.6L3.6,3.6M3.6,-3.6L-3.6,3.6'); },
  air: (g) => { g.append('path').attr('class', 'glyph').attr('d', 'M0,-4.6L4,3.6L0,1.8L-4,3.6Z'); },
  naval: (g) => { g.append('path').attr('class', 'glyph-s').attr('d', 'M0,-4V3.8M-3.6,1A3.6,3.6 0 0 0 3.6,1M-2.2,-2.4H2.2'); },
  political: (g) => { g.append('rect').attr('class', 'glyph').attr('x', -3.2).attr('y', -3.2).attr('width', 6.4).attr('height', 6.4); },
  uprising: (g) => { g.append('path').attr('class', 'glyph').attr('d', 'M0,-4.8L1.2,-1.4L4.6,-1.4L1.9,0.7L2.9,4.2L0,2.1L-2.9,4.2L-1.9,0.7L-4.6,-1.4L-1.2,-1.4Z'); },
  atrocity: (g) => { g.append('circle').attr('class', 'glyph').attr('r', 2.6); }
};
function renderEvents() {
  const d = st.day, all = document.getElementById('ly-allev').checked;
  const vis = D.events.filter(e => e.day <= d && (all || d - e.day <= 75 || (st.sel && st.sel.id === e.id)));
  const sel = gEvents.selectAll('g.ev').data(vis, e => e.id);
  sel.exit().remove();
  const en = sel.enter().append('g').attr('class', 'ev').attr('tabindex', 0).attr('role', 'button')
    .on('click', (ev, e) => { ev.stopPropagation(); openEvent(e, false); })
    .on('keydown', (ev, e) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openEvent(e, false); } })
    .on('pointermove', (ev, e) => tipShow(ev, nm(e), L().short(toDate(e.day)))).on('pointerleave', tipHide);
  en.append('circle').attr('class', 'ring').attr('r', 9);
  en.append('circle').attr('class', 'disc').attr('r', 8);
  en.each(function (e) { GLYPH[e.type](d3.select(this)); });
  const m = en.merge(sel);
  m.attr('aria-label', e => nm(e)).attr('transform', e => { const p = tx(e.ll); return `translate(${p[0].toFixed(1)},${p[1].toFixed(1)})`; })
    .classed('recent', e => d - e.day <= 30).classed('old', e => d - e.day > 30).classed('sel', e => st.sel && st.sel.id === e.id);
  m.sort((a, b) => a.day - b.day);
}

// ---------- tooltip ----------
const tip = document.getElementById('tip');
function tipShow(ev, a, b) {
  if (ev.pointerType === 'touch') return;
  const r = document.getElementById('app').getBoundingClientRect();
  tip.innerHTML = '';
  tip.append(document.createTextNode(a));
  if (b) { const s = document.createElement('small'); s.textContent = b; tip.append(s); }
  tip.hidden = false;
  let x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (x > r.width - 260) x -= 270;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function tipHide() { tip.hidden = true; }

// ---------- panel / text ----------
function phaseOf(day) { let p = D.phases[0]; D.phases.forEach(ph => { if (day >= ph.d0) p = ph; }); return p; }
function renderText() {
  const l = L(), dt = toDate(st.day);
  document.getElementById('dYear').textContent = dt.getUTCFullYear();
  document.getElementById('dMd').textContent = l.md(dt);
  document.getElementById('dayno').innerHTML = st.day >= NDAYS ? l.dayEnd + '<br>' + l.day(st.day + 1) : l.day(st.day + 1);
  const ph = phaseOf(st.day), pi = D.phases.indexOf(ph);
  if (renderText.ph !== ph || renderText.lang !== st.lang) {
    renderText.ph = ph; renderText.lang = st.lang;
    document.getElementById('phaseK').textContent = l.phaseK(pi + 1, l.ym(toDate(ph.d0)), l.ym(toDate(ph.d1)));
    document.getElementById('phaseT').textContent = nm(ph);
    document.getElementById('phaseS').textContent = st.lang === 'zh' ? ph.szh : ph.sen;
    const ol = document.getElementById('evol'); ol.innerHTML = '';
    D.events.filter(e => e.day >= ph.d0 && e.day <= ph.d1).forEach(e => {
      const li = document.createElement('li'); li.dataset.id = e.id;
      const b = document.createElement('button');
      const s1 = document.createElement('span'); s1.className = 'd'; s1.textContent = l.short(toDate(e.day)).replace(/^(\d{4})\./, '$1.');
      const s2 = document.createElement('span'); s2.className = 't'; s2.textContent = nm(e);
      if (st.lang === 'zh') s1.textContent = `${toDate(e.day).getUTCMonth() + 1}月${toDate(e.day).getUTCDate()}日`;
      else s1.textContent = `${toDate(e.day).getUTCDate()} ${MONTHS[toDate(e.day).getUTCMonth()]}`;
      b.append(s1, s2); b.addEventListener('click', () => openEvent(e, true));
      li.append(b); ol.append(li);
    });
    document.querySelectorAll('#tlphases div').forEach((el, i) => el.classList.toggle('cur', i === pi));
  }
  let cur = null; D.events.forEach(e => { if (e.day <= st.day && e.day >= ph.d0) cur = e; });
  document.querySelectorAll('#evol li').forEach(li => {
    const e = D.events.find(x => x.id === li.dataset.id);
    li.classList.toggle('future', e.day > st.day);
    const was = li.classList.contains('cur');
    li.classList.toggle('cur', cur && e.id === cur.id);
    if (!was && cur && e.id === cur.id && st.playing) li.scrollIntoView({ block: 'nearest' });
  });
}
function renderStatic() {
  const l = L();
  document.documentElement.lang = st.lang === 'zh' ? 'zh-CN' : 'en';
  if (st.lang === 'en') document.documentElement.setAttribute('lang', 'en');
  document.querySelectorAll('[data-i]').forEach(el => { const v = l[el.dataset.i]; if (typeof v === 'string') el.textContent = v; });
  document.getElementById('panelToggle').textContent = document.getElementById('panel').classList.contains('open') ? l.less : l.more;
  document.getElementById('lzh').setAttribute('aria-pressed', st.lang === 'zh');
  document.getElementById('len').setAttribute('aria-pressed', st.lang === 'en');
  document.getElementById('ecPrev').textContent = l.prev; document.getElementById('ecNext').textContent = l.next;
  svg.attr('aria-label', st.lang === 'zh' ? '二战欧洲战场互动地图' : 'Interactive map of the Second World War in Europe');
  // legend
  const ul = document.getElementById('lglist'); ul.innerHTML = '';
  D.statusOrder.forEach(s => {
    const li = document.createElement('li'); li.dataset.s = s; li.tabIndex = 0;
    const sw = document.createElement('span'); sw.className = 'sw';
    sw.style.background = s === 'occ' ? 'repeating-linear-gradient(45deg, var(--s-occ) 0 3px, var(--s-reich) 3px 4.5px)' : `var(--s-${s})`;
    li.append(sw, document.createTextNode(statusLabel(s)));
    const on = () => { st.focus = s; applyFocus(); }, off = () => { st.focus = null; applyFocus(); };
    li.addEventListener('pointerenter', on); li.addEventListener('pointerleave', off); li.addEventListener('focus', on); li.addEventListener('blur', off);
    ul.append(li);
  });
  // timeline phases
  const tp = document.getElementById('tlphases'); tp.innerHTML = '';
  D.phases.forEach((p, i) => {
    const el = document.createElement('div');
    el.style.width = ((Math.min(p.d1, NDAYS) - p.d0 + 1) / (NDAYS + 1) * 100) + '%';
    el.textContent = nm(p); el.title = nm(p);
    el.addEventListener('click', () => { setDay(p.d0); });
    tp.append(el);
  });
  renderText.ph = null; renderText();
  document.getElementById('asof').textContent = l.asof + l.short(toDate(snapDays[st.snap]));
  document.getElementById('play').setAttribute('aria-label', st.playing ? l.pause : l.play);
  if (st.sel) fillCard(st.sel);
  renderOverlay();
}
function applyFocus() {
  const f = st.focus;
  root.selectAll('.ctry, .zone').classed('dim', function () { return f && this.getAttribute('data-s') !== f; });
  document.querySelectorAll('#lglist li').forEach(li => li.classList.toggle('off', !!f && li.dataset.s !== f));
}

// ---------- event card ----------
const card = document.getElementById('evcard');
function fillCard(e) {
  const l = L();
  document.getElementById('ecType').textContent = l.types[e.type];
  document.getElementById('ecTitle').textContent = nm(e);
  document.getElementById('ecDate').textContent = l.full(toDate(e.day));
  const [lo, la] = e.ll;
  document.getElementById('ecLL').textContent = `${Math.abs(la).toFixed(2)}°${la >= 0 ? 'N' : 'S'} ${Math.abs(lo).toFixed(2)}°${lo >= 0 ? 'E' : 'W'}`;
  document.getElementById('ecDesc').textContent = st.lang === 'zh' ? e.dzh : e.den;
}
function openEvent(e, fly) {
  st.sel = e; fillCard(e); card.hidden = false;
  stop();
  setDay(e.day);
  if (fly) flyTo(e.ll);
}
function closeCard() { st.sel = null; card.hidden = true; renderEvents(); }
function stepEvent(dir) {
  let idx;
  if (st.sel) idx = D.events.indexOf(st.sel) + dir;
  else if (dir > 0) idx = D.events.findIndex(e => e.day > st.day);
  else { idx = -1; D.events.forEach((e, i) => { if (e.day < st.day) idx = i; }); }
  if (idx < 0 || idx >= D.events.length) return;
  openEvent(D.events[idx], true);
}

// ---------- zoom ----------
const zoom = d3.zoom().scaleExtent([1, 9]).on('zoom', (ev) => {
  st.t = ev.transform; root.attr('transform', ev.transform);
  renderOverlay();
});
svg.call(zoom).on('dblclick.zoom', null);
svg.on('click', () => { if (!card.hidden && W < 760) closeCard(); });
function flyTo(ll) {
  const p = P(ll), k = Math.max(st.t.k, 2.2);
  const pw = W < 760 ? 0 : document.getElementById('panel').getBoundingClientRect().width + 32;
  const cx = W < 760 ? W / 2 : pw + (W - pw - 360) / 2, cy = W < 760 ? H * .45 : (H - 100) / 2;
  svg.transition().duration(900).call(zoom.transform, d3.zoomIdentity.translate(cx - p[0] * k, cy - p[1] * k).scale(k));
}
document.getElementById('zin').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.6);
document.getElementById('zout').onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.6);
document.getElementById('zreset').onclick = () => svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);

// ---------- timeline ----------
const slider = document.getElementById('slider');
slider.max = NDAYS;
function buildTimeline() {
  const yrs = document.getElementById('tlyears'); yrs.innerHTML = '';
  for (let y = 1940; y <= 1945; y++) {
    const s = document.createElement('span'); s.style.left = (toDay(y + '-01-01') / NDAYS * 100) + '%'; s.textContent = y; yrs.append(s);
  }
  const ev = document.getElementById('tlevts'); ev.innerHTML = '';
  D.events.forEach(e => { const t = document.createElement('div'); t.className = 'tl-evt'; t.style.left = (e.day / NDAYS * 100) + '%'; t.dataset.d = e.day; ev.append(t); });
}
function renderTimeline() {
  const pct = st.day / NDAYS * 100;
  document.getElementById('tlfill').style.width = pct + '%';
  document.getElementById('tlthumb').style.left = pct + '%';
  slider.value = st.day;
  slider.setAttribute('aria-valuetext', L().full(toDate(st.day)));
  document.querySelectorAll('.tl-evt').forEach(t => t.classList.toggle('done', +t.dataset.d <= st.day));
}
function setDay(n) {
  st.day = Math.max(0, Math.min(NDAYS, Math.round(n)));
  renderSnap(false); renderText(); renderTimeline(); renderArrows(); renderEvents();
}
slider.addEventListener('input', () => { stop(); setDay(+slider.value); });
const hov = document.getElementById('tlhover');
document.getElementById('tlmain').addEventListener('pointermove', (ev) => {
  const r = slider.getBoundingClientRect(), m = document.getElementById('tlmain').getBoundingClientRect();
  const f = Math.max(0, Math.min(1, (ev.clientX - m.left) / m.width));
  hov.hidden = false; hov.style.left = (f * 100) + '%'; hov.textContent = L().short(toDate(Math.round(f * NDAYS)));
});
document.getElementById('tlmain').addEventListener('pointerleave', () => { hov.hidden = true; });

// play
let raf = 0, last = 0;
const SPEEDS = [0.5, 1, 2, 4];
function play() {
  if (st.day >= NDAYS) setDay(0);
  st.playing = true; last = 0; setPlayIcon();
  let acc = st.day;
  const loop = (ts) => {
    if (!st.playing) return;
    const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0; last = ts;
    acc += dt * 30 * st.speed;
    if (acc >= NDAYS) { setDay(NDAYS); stop(); return; }
    if (Math.floor(acc) !== st.day) setDay(Math.floor(acc));
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}
function stop() { st.playing = false; cancelAnimationFrame(raf); setPlayIcon(); }
function setPlayIcon() {
  document.getElementById('playIco').innerHTML = st.playing ? '<path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor"/>' : '<path d="M4 2.5v11L13.5 8Z" fill="currentColor"/>';
  document.getElementById('play').setAttribute('aria-label', st.playing ? L().pause : L().play);
}
document.getElementById('play').onclick = () => st.playing ? stop() : play();
document.getElementById('speed').onclick = (ev) => { const i = (SPEEDS.indexOf(st.speed) + 1) % SPEEDS.length; st.speed = SPEEDS[i]; ev.currentTarget.textContent = st.speed + '×'; };
document.getElementById('prevEv').onclick = () => stepEvent(-1);
document.getElementById('nextEv').onclick = () => stepEvent(1);
document.getElementById('ecPrev').onclick = () => stepEvent(-1);
document.getElementById('ecNext').onclick = () => stepEvent(1);
document.getElementById('ecClose').onclick = closeCard;

document.addEventListener('keydown', (ev) => {
  if (ev.target.tagName === 'INPUT' && ev.target.type !== 'range' && ev.target.type !== 'checkbox') return;
  if (ev.key === ' ' && ev.target.tagName !== 'BUTTON' && !ev.target.closest('.ev')) { ev.preventDefault(); st.playing ? stop() : play(); }
  else if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
    if (ev.target === slider && !ev.shiftKey) return;
    ev.preventDefault();
    const dir = ev.key === 'ArrowRight' ? 1 : -1;
    if (ev.shiftKey) { stop(); setDay(st.day + dir * 30); } else stepEvent(dir);
  } else if (ev.key === 'Escape') { closeCard(); document.getElementById('layers').hidden = true; }
});

// ---------- toolbar ----------
function setLang(l) { st.lang = l; try { localStorage.setItem('ww2-lang', l); } catch (e) { /* storage unavailable */ } renderStatic(); renderTimeline(); }
document.getElementById('lzh').onclick = () => setLang('zh');
document.getElementById('len').onclick = () => setLang('en');
const lb = document.getElementById('layersBtn'), lp = document.getElementById('layers');
lb.onclick = (ev) => { ev.stopPropagation(); lp.hidden = !lp.hidden; lb.setAttribute('aria-expanded', !lp.hidden); };
document.addEventListener('click', (ev) => { if (!lp.hidden && !ev.target.closest('.layers-wrap')) { lp.hidden = true; lb.setAttribute('aria-expanded', 'false'); } });
const LAYERS = { arrows: 'hide-arrows', events: 'hide-events', fronts: 'hide-fronts', ghost: 'hide-ghost', cities: 'hide-cities', labels: 'hide-labels', rivers: 'hide-rivers' };
for (const k in LAYERS) document.getElementById('ly-' + k).addEventListener('change', (ev) => { svg.classed(LAYERS[k], !ev.target.checked); });
document.getElementById('ly-allev').addEventListener('change', renderEvents);
document.getElementById('panelToggle').onclick = () => {
  const p = document.getElementById('panel'); p.classList.toggle('open');
  document.getElementById('panelToggle').setAttribute('aria-expanded', p.classList.contains('open'));
  document.getElementById('panelToggle').textContent = p.classList.contains('open') ? L().less : L().more;
};

// ---------- boot ----------
function boot() {
  buildTimeline();
  const h = (location.hash || '').slice(1);
  if (/^\d{4}-\d{2}-\d{2}$/.test(h)) st.day = Math.max(0, Math.min(NDAYS, toDay(h)));
  else if (h === 'en' || h === 'zh') st.lang = h;
  else st.day = toDay('1941-06-22');
  layout();
  renderStatic();
  setDay(st.day);
  const ev = D.events.find(e => e.id === h);
  if (ev) openEvent(ev, true);
}
let rt = 0;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { svg.call(zoom.transform, d3.zoomIdentity); layout(); }, 150); });
boot();
})();
</script>
