<style>
/* Layout: a full-screen strategy map; a command bar along the top (date and game speed in the middle), a briefing column on the left, the order of battle on the right, a dated timeline along the bottom. Deliberately one dark theme, like a war-room console. */
:root {
  color-scheme: dark;
  --ui-0: #141815;
  --ui-1: #1d221e;
  --ui-2: #262c27;
  --ui-3: #323a33;
  --brass: #c9a75c;
  --brass-dim: #8a7444;
  --line: rgba(201, 167, 92, .28);
  --line-soft: rgba(232, 224, 198, .10);
  --ink: #ebe4cc;
  --ink-2: #b9b199;
  --ink-3: #8a8471;
  --alert: #e2553c;
  --ok: #7fb069;
  --sea: #1c3a45;
  --sea-2: #142b34;
  --shadow: 0 2px 4px rgba(0, 0, 0, .45), 0 10px 30px rgba(0, 0, 0, .45);
  --f-serif: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-sc: "Spectral SC", "Noto Serif SC", Georgia, serif;
  --f-ui: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-num: "Oswald", "Arial Narrow", "Noto Sans SC", sans-serif;
}
html, body { height: 100%; }
body { background: var(--sea-2); color: var(--ink); font-family: var(--f-ui); font-size: 13px; overflow: hidden; }
#app { position: relative; height: 100%; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map.drag { cursor: grabbing; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* --- framed panels --- */
.frame { background: linear-gradient(180deg, var(--ui-2), var(--ui-1)); border: 1px solid var(--line); box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .05); position: relative; }
.frame::before { content: ""; position: absolute; inset: 3px; border: 1px solid var(--line-soft); pointer-events: none; }
.plate { font-family: var(--f-sc); letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--brass); display: flex; align-items: center; gap: 8px; }
.plate::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
html[lang="zh-CN"] .plate { font-family: var(--f-serif); letter-spacing: .3em; font-size: 12px; }

/* --- top command bar --- */
#top { position: absolute; left: 0; right: 0; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; gap: 12px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: calc(8px + env(safe-area-inset-top, 0px)) 8px; pointer-events: none; }
#top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 12px; padding: 6px 14px 6px 8px; justify-self: start; min-width: 0; }
.seal { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border: 1px solid var(--brass-dim); background: radial-gradient(circle at 50% 40%, #3a2f1c, #1a160e); color: var(--brass); font-family: var(--f-serif); font-weight: 900; font-size: 19px; }
.brand-t { min-width: 0; }
.brand h1 { margin: 0; font-family: var(--f-serif); font-weight: 900; font-size: 20px; letter-spacing: .12em; line-height: 1.15; white-space: nowrap; }
html[lang="en"] .brand h1 { font-family: var(--f-sc); font-size: 19px; letter-spacing: .08em; }
.brand small { display: block; color: var(--ink-3); font-size: 11px; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { display: flex; align-items: center; gap: 14px; padding: 6px 14px; }
.date { text-align: center; min-width: 210px; }
.date b { display: block; font-family: var(--f-num); font-weight: 500; font-size: 26px; letter-spacing: .04em; line-height: 1.05; font-variant-numeric: tabular-nums; color: var(--ink); }
html[lang="zh-CN"] .date b { font-family: var(--f-serif); font-weight: 900; font-size: 23px; letter-spacing: .06em; }
.date span { font-size: 11px; color: var(--ink-3); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.speed { display: flex; align-items: center; gap: 6px; }
.speed .play { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--brass); background: radial-gradient(circle at 50% 35%, #4a3d22, #241d10); color: var(--brass); cursor: pointer; display: grid; place-items: center; padding: 0; }
.speed .play:hover { background: radial-gradient(circle at 50% 35%, #5c4b29, #2c2414); }
.pips { display: flex; gap: 3px; }
.pips button { width: 13px; height: 22px; padding: 0; border: 1px solid var(--brass-dim); background: var(--ui-0); cursor: pointer; }
.pips button.on { background: linear-gradient(180deg, #e7c779, #a8853f); border-color: var(--brass); }
.pips button:hover { border-color: var(--brass); }
.tools { justify-self: end; display: flex; gap: 6px; align-items: flex-start; }
.tbtn { height: 34px; min-width: 34px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--ui-3), var(--ui-1)); cursor: pointer; font-size: 12.5px; color: var(--ink); box-shadow: var(--shadow); }
.tbtn:hover { border-color: var(--brass); }
.tbtn[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
.seg { display: flex; box-shadow: var(--shadow); }
.seg .tbtn { box-shadow: none; }
.seg .tbtn + .tbtn { border-left: 0; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: 40px; width: 220px; padding: 8px 0; display: grid; z-index: 20; }
.menu label, .menu button { display: flex; align-items: center; gap: 10px; padding: 7px 14px; cursor: pointer; font-size: 13px; background: none; border: 0; text-align: left; width: 100%; color: var(--ink); }
.menu label:hover, .menu button:hover { background: rgba(201, 167, 92, .10); }
.menu input { accent-color: var(--brass); width: 15px; height: 15px; margin: 0; }
.menu .sep { height: 1px; background: var(--line-soft); margin: 6px 0; }

/* --- briefing (left) --- */
#brief { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: calc(76px + env(safe-area-inset-top, 0px)); bottom: 104px; width: 330px; z-index: 9; display: flex; flex-direction: column; overflow: hidden; }
.b-sec { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); display: grid; gap: 7px; }
.phase-k { font-family: var(--f-num); font-size: 11.5px; letter-spacing: .12em; color: var(--brass); text-transform: uppercase; }
.phase h2 { margin: 0; font-family: var(--f-serif); font-weight: 900; font-size: 22px; letter-spacing: .06em; text-wrap: balance; }
html[lang="en"] .phase h2 { font-family: var(--f-sc); font-size: 21px; letter-spacing: .03em; }
.phase p { margin: 0; font-size: 12.8px; line-height: 1.72; color: var(--ink-2); max-width: 62ch; }
.bars { display: grid; gap: 6px; }
.bar-row { display: grid; grid-template-columns: 92px 1fr 42px; gap: 8px; align-items: center; font-size: 12px; }
.bar-row .tr { height: 9px; background: var(--ui-0); border: 1px solid var(--line-soft); position: relative; overflow: hidden; }
.bar-row .tr i { position: absolute; left: 0; top: 0; bottom: 0; transition: width .4s ease; }
.bar-row .v { font-family: var(--f-num); text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.bars small { color: var(--ink-3); font-size: 10.5px; }
.evlist { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 0 12px; scrollbar-width: thin; scrollbar-color: var(--brass-dim) transparent; }
.evlist .plate { margin: 0 16px 6px; }
.evlist ol { list-style: none; margin: 0; padding: 0; }
.evlist li button { width: 100%; text-align: left; background: none; border: 0; padding: 6px 16px; display: grid; grid-template-columns: 58px 1fr; gap: 8px; align-items: baseline; cursor: pointer; border-left: 3px solid transparent; }
.evlist li button:hover { background: rgba(201, 167, 92, .07); }
.evlist .d { font-family: var(--f-num); font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.evlist .t { font-size: 12.8px; line-height: 1.45; }
.evlist li.future { opacity: .42; }
.evlist li.cur button { border-left-color: var(--brass); background: rgba(201, 167, 92, .10); }
.evlist li.cur .t { color: var(--brass); font-weight: 700; }
.evlist li.major .t::after { content: " ◆"; color: var(--alert); font-size: 9px; vertical-align: 2px; }
.note { padding: 10px 16px 0; color: var(--ink-3); font-size: 10.8px; line-height: 1.6; border-top: 1px solid var(--line-soft); margin-top: 8px; }
.b-toggle { display: none; }

/* --- order of battle (right) --- */
#oob { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: calc(76px + env(safe-area-inset-top, 0px)); width: 236px; z-index: 9; padding: 12px 14px 12px; display: grid; gap: 10px; max-height: calc(100% - 200px); overflow-y: auto; }
.fac { display: grid; gap: 2px; }
.fac h4 { margin: 0 0 3px; font-family: var(--f-serif); font-size: 12.5px; font-weight: 600; color: var(--ink-2); letter-spacing: .12em; display: flex; justify-content: space-between; }
html[lang="en"] .fac h4 { font-family: var(--f-sc); letter-spacing: .06em; }
.fac h4 em { font-style: normal; font-family: var(--f-num); font-size: 10.5px; letter-spacing: .08em; padding: 0 5px; border: 1px solid; line-height: 16px; }
.fac h4 em.war { color: var(--alert); border-color: rgba(226, 85, 60, .5); }
.fac h4 em.peace { color: var(--ink-3); border-color: var(--line-soft); }
.st { display: flex; align-items: center; gap: 8px; padding: 3px 4px; font-size: 12.3px; cursor: default; border: 1px solid transparent; }
.st:hover, .st:focus { border-color: var(--line); background: rgba(201, 167, 92, .06); }
.st.off { opacity: .35; }
.flag { width: 24px; height: 16px; flex: none; box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 0 0 2px rgba(201, 167, 92, .25); display: block; }
.sw { width: 10px; height: 10px; flex: none; margin-left: auto; box-shadow: 0 0 0 1px rgba(0, 0, 0, .5); }
.keys { display: grid; gap: 5px; border-top: 1px solid var(--line-soft); padding-top: 9px; font-size: 11.5px; color: var(--ink-2); }
.keys div { display: flex; align-items: center; gap: 8px; }
.keys svg { flex: none; }

/* --- news card --- */
#news { position: absolute; z-index: 30; left: 50%; top: calc(86px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: min(460px, calc(100% - 32px)); max-height: calc(100% - 210px); display: flex; flex-direction: column; }
.news-head { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px 8px 16px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(201, 167, 92, .16), transparent); }
.news-x { width: 30px; height: 30px; border: 1px solid var(--line); background: var(--ui-1); color: var(--ink-2); cursor: pointer; font-size: 16px; line-height: 1; }
.news-x:hover { color: var(--ink); border-color: var(--brass); }
.paper { margin: 14px 16px 0; background: #e9e1c9; color: #231d12; padding: 14px 16px 16px; box-shadow: inset 0 0 40px rgba(120, 90, 40, .25); overflow-y: auto; min-height: 0; }
.paper .mast { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px double #3b3020; padding-bottom: 6px; margin-bottom: 10px; font-family: var(--f-num); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #5a4b31; gap: 8px; }
.paper .mast b { font-family: var(--f-serif); font-weight: 900; font-size: 15px; letter-spacing: .2em; color: #231d12; }
.paper h3 { margin: 0 0 8px; font-family: var(--f-serif); font-weight: 900; font-size: 25px; line-height: 1.25; text-wrap: balance; }
html[lang="en"] .paper h3 { font-family: var(--f-sc); font-size: 24px; }
.paper .meta { font-family: var(--f-num); font-size: 11.5px; letter-spacing: .06em; color: #6c5b3c; margin-bottom: 8px; }
.paper p { margin: 0; font-family: var(--f-serif); font-weight: 600; font-size: 14px; line-height: 1.85; color: #2c2416; }
html[lang="en"] .paper p { font-family: Georgia, "Noto Serif SC", serif; font-weight: 400; font-size: 14.5px; line-height: 1.65; }
.news-act { display: flex; gap: 8px; padding: 12px 16px 14px; }
.news-act button { flex: 1; height: 34px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--ui-3), var(--ui-1)); cursor: pointer; font-size: 12.5px; }
.news-act button:hover { border-color: var(--brass); color: var(--brass); }
.news-act button.primary { border-color: var(--brass); color: var(--brass); }

/* --- toasts --- */
#toasts { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 104px; z-index: 25; display: grid; gap: 6px; width: 280px; pointer-events: none; }
.toast { pointer-events: auto; cursor: pointer; padding: 9px 12px 9px 14px; display: grid; gap: 2px; border-left: 3px solid var(--alert); animation: tin .35s ease; }
.toast b { font-family: var(--f-serif); font-size: 14px; }
.toast span { font-family: var(--f-num); font-size: 11px; color: var(--ink-3); letter-spacing: .06em; }
@keyframes tin { from { transform: translateX(30px); opacity: 0; } to { transform: none; opacity: 1; } }

/* --- scale bar --- */
#scale { position: absolute; left: 360px; bottom: 108px; z-index: 8; font-family: var(--f-num); font-size: 11px; color: var(--ink); text-shadow: 0 1px 2px #000; pointer-events: none; }
#scale i { display: block; height: 6px; border: 1.5px solid var(--ink); border-top: 0; margin-top: 2px; box-shadow: 0 1px 2px rgba(0, 0, 0, .6); }

/* --- tooltip --- */
#tip { position: absolute; z-index: 40; pointer-events: none; padding: 7px 10px; font-size: 12px; line-height: 1.5; max-width: 260px; transform: translate(14px, 14px); }
#tip b { display: block; font-family: var(--f-serif); font-size: 13.5px; }
#tip span { display: block; color: var(--ink-2); }
#tip .chip { display: inline-block; width: 9px; height: 9px; margin-right: 6px; box-shadow: 0 0 0 1px #000; vertical-align: 0; }

/* --- timeline --- */
#timeline { position: absolute; left: 0; right: 0; bottom: 0; z-index: 10; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 14px; align-items: center; border-left: 0; border-right: 0; border-bottom: 0; }
#timeline::before { display: none; }
.tl-ctl { display: flex; gap: 6px; flex: none; }
.tl-ctl button { width: 34px; height: 34px; border: 1px solid var(--line); background: linear-gradient(180deg, var(--ui-3), var(--ui-1)); cursor: pointer; display: grid; place-items: center; padding: 0; color: var(--ink-2); }
.tl-ctl button:hover { border-color: var(--brass); color: var(--brass); }
.tl-main { flex: 1; min-width: 0; position: relative; height: 66px; }
.tl-phases { position: absolute; left: 0; right: 0; top: 0; height: 22px; display: flex; }
.tl-phases div { height: 100%; border-right: 1px solid var(--line-soft); font-size: 11px; color: var(--ink-3); padding: 4px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.tl-phases div:nth-child(odd) { background: rgba(255, 255, 255, .03); }
.tl-phases div.cur { color: var(--brass); box-shadow: inset 0 -2px 0 var(--brass); }
.tl-track { position: absolute; left: 0; right: 0; top: 31px; height: 6px; background: var(--ui-0); border: 1px solid var(--line-soft); }
.tl-fill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #6b5630, var(--brass)); }
.tl-evt { position: absolute; top: 27px; width: 2px; height: 14px; margin-left: -1px; background: var(--ink-3); opacity: .35; pointer-events: none; }
.tl-evt.major { height: 18px; top: 25px; width: 3px; margin-left: -1.5px; background: var(--alert); opacity: .5; }
.tl-evt.done { opacity: .95; }
.tl-thumb { position: absolute; top: 34px; width: 16px; height: 16px; margin: -8px 0 0 -8px; transform: rotate(45deg); background: var(--brass); border: 2px solid var(--ui-0); box-shadow: 0 0 0 1px var(--brass); pointer-events: none; }
.tl-years { position: absolute; left: 0; right: 0; top: 47px; height: 16px; }
.tl-years span { position: absolute; transform: translateX(-50%); font-family: var(--f-num); font-size: 11px; color: var(--ink-3); }
.tl-years span::before { content: ""; position: absolute; left: 50%; top: -6px; width: 1px; height: 5px; background: var(--ink-3); }
#slider { position: absolute; left: -8px; right: -8px; width: calc(100% + 16px); top: 20px; height: 30px; margin: 0; opacity: 0; cursor: pointer; }
.tl-hover { position: absolute; top: -24px; transform: translateX(-50%); background: var(--ui-0); border: 1px solid var(--line); color: var(--ink); font-family: var(--f-num); font-size: 11px; padding: 2px 7px; white-space: nowrap; pointer-events: none; }

#loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 50; background: var(--sea-2); color: var(--brass); font-family: var(--f-serif); letter-spacing: .3em; font-size: 15px; }

@media (max-width: 1150px) { .brand small { display: none; } #oob { width: 210px; } }
@media (max-width: 900px) {
  #top { grid-template-columns: 1fr auto; gap: 8px; }
  .brand { display: none; }
  .clock { justify-self: start; padding: 4px 10px; gap: 10px; }
  .date { min-width: 0; text-align: left; }
  .date b { font-size: 17px; }
  html[lang="zh-CN"] .date b { font-size: 16px; }
  .tools .lbl { display: none; }
  .pips { display: none; }
  .speed .play { width: 34px; height: 34px; }
  .date b { white-space: nowrap; }
  .date span { white-space: nowrap; }
  .seg .tbtn[aria-pressed="true"] { display: none; }
  .tools { gap: 4px; }
  #brief { left: max(8px, env(safe-area-inset-left, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); width: auto; top: calc(66px + env(safe-area-inset-top, 0px)); bottom: auto; max-height: calc(100% - 190px); }
  #brief:not(.open) .phase p, #brief:not(.open) .bars-sec, #brief:not(.open) .evlist { display: none; }
  .phase { grid-template-columns: 1fr auto; align-items: center; }
  .phase .phase-k { grid-column: 1 / -1; }
  .phase h2 { font-size: 17px; }
  .b-toggle { display: inline-flex; height: 28px; padding: 0 10px; align-items: center; border: 1px solid var(--line); background: var(--ui-1); cursor: pointer; font-size: 12px; }
  .phase p { grid-column: 1 / -1; }
  #oob { display: none; }
  #oob.open { display: grid; top: auto; bottom: 100px; right: max(8px, env(safe-area-inset-right, 0px)); max-height: 55%; }
  #scale { left: 14px; bottom: 98px; }
  #toasts { width: 230px; bottom: 98px; }
  .tl-phases div { font-size: 10px; padding: 4px 3px; }
  .tl-ctl .skip { display: none; }
}
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } .bar-row .tr i { transition: none; } }
</style>

          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 15 5 8 8.5 1 5Z M1 8l7 3.5L15 8 M1 11l7 3.5L15 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>

<script>
(function () {
'use strict';
const A = window.PA, G = window.PAGEO;

// ============================================================ text
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const T = {
  zh: {
    title: '烽火亚太', subtitle: '第二次世界大战 · 亚洲及太平洋战场 1937—1945', views: '视角', layers: '图层', more: '详情', less: '收起',
    ly_front: '前线', ly_arrows: '攻势箭头', ly_events: '事件标记', ly_names: '国名', ly_cities: '城市', ly_grid: '省份网格', ly_prov: '中国省界', ly_rivers: '河流湖泊',
    ly_toasts: '播放时弹出大事通知', ly_pause: '遇到大事自动暂停',
    cnhead: '中国境内控制面积', cnnote: '按地图网格估算的示意比例，非精确统计。', evhead: '本阶段大事', oobhead: '交战各方',
    k_front: '交战前线', k_occ: '占领区（斜线）', k_arrow: '攻势方向（颜色为进攻方）', paper: '号外',
    prev: '‹ 上一事件', next: '下一事件 ›', go: '在地图上查看', war: '交战', peace: '未参战',
    bar: { axis: '日本及傀儡', roc: '国民政府', ccp: '中共根据地', sov: '苏蒙军' },
    types: { battle: '战役', air: '空战与轰炸', naval: '海战', political: '政治外交', atrocity: '暴行', disaster: '灾难' },
    disclaimer: '控制区与战线为根据战役地图绘制的示意性近似，在省份网格上按日期切换，不代表精确的测绘边界。敌后游击区、地方实力派等未能一一标出；中国省界采用现代省界近似。',
    day: (n) => `抗战第 ${n} 天`, after: '战争结束',
    phaseK: (i, a, b) => `第 ${i} 阶段 · ${a} — ${b}`,
    full: (d) => `${d.getUTCFullYear()}年${d.getUTCMonth() + 1}月${d.getUTCDate()}日`,
    ym: (d) => `${d.getUTCFullYear()}.${d.getUTCMonth() + 1}`,
    md: (d) => `${d.getUTCMonth() + 1}月${d.getUTCDate()}日`,
    short: (d) => `${d.getUTCFullYear()}.${String(d.getUTCMonth() + 1).padStart(2, '0')}.${String(d.getUTCDate()).padStart(2, '0')}`,
    occOf: (n) => `${n}占领区`, held: '控制方', zone: '区域'
  },
  en: {
    title: 'Pacific Ablaze', subtitle: 'The Second World War in Asia and the Pacific, 1937–1945', views: 'View', layers: 'Layers', more: 'More', less: 'Less',
    ly_front: 'Front lines', ly_arrows: 'Offensives', ly_events: 'Events', ly_names: 'Country names', ly_cities: 'Cities', ly_grid: 'Province grid', ly_prov: 'Chinese provinces', ly_rivers: 'Rivers & lakes',
    ly_toasts: 'Notify major events while playing', ly_pause: 'Pause on major events',
    cnhead: 'Control of China by area', cnnote: 'Rough shares estimated from the map grid, not precise statistics.', evhead: 'Key events this phase', oobhead: 'Belligerents',
    k_front: 'Front line', k_occ: 'Occupied territory (hatched)', k_arrow: 'Offensive (attacker\'s colour)', paper: 'EXTRA',
    prev: '‹ Previous', next: 'Next ›', go: 'Show on map', war: 'AT WAR', peace: 'NOT AT WAR',
    bar: { axis: 'Japan & puppets', roc: 'Nationalists', ccp: 'Communist areas', sov: 'Soviet forces' },
    types: { battle: 'Battle', air: 'Air war', naval: 'Naval', political: 'Politics', atrocity: 'Atrocity', disaster: 'Disaster' },
    disclaimer: 'Areas of control and front lines are schematic approximations drawn from campaign maps and switched by date on a grid of provinces. They are not surveyed borders. Guerrilla zones and regional strongmen are not all shown; Chinese provincial lines follow modern boundaries.',
    day: (n) => `Day ${n} of the war in China`, after: 'War over',
    phaseK: (i, a, b) => `Phase ${i} · ${a} — ${b}`,
    full: (d) => `${d.getUTCDate()} ${MONL[d.getUTCMonth()]} ${d.getUTCFullYear()}`,
    ym: (d) => `${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`,
    md: (d) => `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`,
    short: (d) => `${String(d.getUTCDate()).padStart(2, '0')} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`,
    occOf: (n) => `${n}-occupied`, held: 'Held by', zone: 'Area'
  }
};

// ============================================================ time
const DAY = 864e5;
const ds = (s) => { const p = s.split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); };
const T0 = ds(A.T0), T1 = ds(A.T1);
const NDAYS = Math.round((T1 - T0) / DAY);
const toDay = (s) => Math.round((ds(s) - T0) / DAY);
const toDate = (n) => new Date(T0 + n * DAY);

const st = { day: toDay('1941-12-08'), lang: 'zh', playing: false, speed: 3, focus: null, sel: null, hover: null };
try { const l = localStorage.getItem('pa-lang'); if (l === 'en' || l === 'zh') st.lang = l; } catch (e) { /* storage unavailable */ }
const L = () => T[st.lang];
const nm = (o) => (st.lang === 'zh' ? o.zh : o.en);
const ni = (arr) => (arr ? arr[st.lang === 'zh' ? 0 : 1] : '');

// ============================================================ projection & geometry (world px)
const proj = d3.geoMercator().rotate([-137, 0]).scale(1000).translate([0, 0]);
const P = (ll) => proj(ll);
function ringPath(path, ring) {
  for (let i = 0; i < ring.length; i++) { const q = P(ring[i]); if (i) path.lineTo(q[0], q[1]); else path.moveTo(q[0], q[1]); }
  path.closePath();
}
function linePath(path, pts) {
  for (let i = 0; i < pts.length; i++) { const q = P(pts[i]); if (i) path.lineTo(q[0], q[1]); else path.moveTo(q[0], q[1]); }
}

const units = {};
const landPath = new Path2D();
for (const u in G.units) {
  const p = new Path2D();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  let ar = 0;
  G.units[u].r.forEach(r => {
    ringPath(p, r);
    for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const a = P(r[j]), b = P(r[i]); ar += a[0] * b[1] - b[0] * a[1]; }
    r.forEach(c => { const q = P(c); if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0]; if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; });
  });
  landPath.addPath(p);
  units[u] = { id: u, path: p, bb: [x0, y0, x1, y1], n: G.units[u].n, cells: [], land: Math.abs(ar / 2) };
}
// small islands: their cells get a marker so control stays visible when zoomed out
const smallRings = {};
for (const u in G.units) {
  G.units[u].r.forEach(r => {
    let a = 0; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const p1 = P(r[j]), p2 = P(r[i]); a += p1[0] * p2[1] - p2[0] * p1[1]; }
    if (Math.abs(a / 2) < 45) {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; r.forEach(([x, y]) => { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; });
      (smallRings[u] || (smallRings[u] = [])).push({ r, bb: [x0 - 0.05, y0 - 0.05, x1 + 0.05, y1 + 0.05] });
    }
  });
}
const borderPath = new Path2D();
G.borders.forEach(b => linePath(borderPath, b[2]));
const provPath = new Path2D();
G.plines.forEach(l => linePath(provPath, l));
const riverPath = new Path2D(), riverPathMinor = new Path2D();
G.rivers.forEach(r => linePath(r.r <= 4 ? riverPath : riverPathMinor, r.l));
const lakePath = new Path2D();
G.lakes.forEach(r => ringPath(lakePath, r));
const gratPath = new Path2D();
for (let lon = 70; lon <= 210; lon += 10) { const pts = []; for (let lat = -50; lat <= 64; lat += 2) pts.push([lon, lat]); linePath(gratPath, pts); }
for (let lat = -40; lat <= 60; lat += 10) { const pts = []; for (let lon = 64; lon <= 212; lon += 2) pts.push([lon, lat]); linePath(gratPath, pts); }
const tropic = new Path2D();
[[23.44], [-23.44], [0]].forEach(([lat]) => { const pts = []; for (let lon = 64; lon <= 212; lon += 2) pts.push([lon, lat]); linePath(tropic, pts); });

// ============================================================ province grid (Voronoi per unit)
const cells = [];          // {u, x, y, lon, lat, poly, w}
const eA = [], eB = [], eSeg = [];  // adjacency edges with geometry [x1,y1,x2,y2]
const adj = [];            // label adjacency pairs [a, b]
const spacingCN = (x, y) => (x < 98 ? 1.25 : (x < 103 || y > 45) ? 0.8 : 0.5);
for (const u in units) {
  const seeds = G.seeds[u] || [];
  const U = units[u];
  if (!seeds.length) continue;
  const pts = seeds.map(P);
  const [x0, y0, x1, y1] = U.bb;
  const del = d3.Delaunay.from(pts);
  const vor = del.voronoi([x0 - 30, y0 - 30, x1 + 30, y1 + 30]);
  U.del = del; U.vor = vor; U.base = cells.length;
  U.gridPath = new Path2D(vor.render());
  const nnd = [];
  pts.forEach((q, i) => {
    const poly = vor.cellPolygon(i) || [];
    let a = 0; for (let k = 0; k < poly.length - 1; k++) a += poly[k][0] * poly[k + 1][1] - poly[k + 1][0] * poly[k][1];
    const ll = seeds[i];
    let w;
    if (u === 'CHN') { const s = spacingCN(ll[0], ll[1]); w = s * s * Math.cos(ll[1] * Math.PI / 180); } else w = Math.abs(a / 2);
    const islet = (smallRings[u] || []).some(sr => ll[0] >= sr.bb[0] && ll[0] <= sr.bb[2] && ll[1] >= sr.bb[1] && ll[1] <= sr.bb[3]);
    cells.push({ u, x: q[0], y: q[1], lon: ll[0], lat: ll[1], poly, w, area: Math.abs(a / 2), islet });
    U.cells.push(cells.length - 1);
    let best = 1e9; for (const j of del.neighbors(i)) { if (!pts[j]) continue; const d = Math.hypot(pts[j][0] - q[0], pts[j][1] - q[1]); if (d < best) best = d; }
    nnd.push(best);
  });
  const cap = 1.6 * U.land / Math.max(1, pts.length);
  U.cells.forEach(ci => { cells[ci].wl = Math.min(cells[ci].area, cap); });
  nnd.sort((a, b) => a - b);
  const med = nnd.length ? nnd[Math.floor(nnd.length / 2)] : 20;
  U.med = med;
  // shared edges between neighbouring cells
  pts.forEach((q, i) => {
    const poly = vor.cellPolygon(i); if (!poly) return;
    const nb = [...del.neighbors(i)].filter(j => pts[j]);
    for (let k = 0; k < poly.length - 1; k++) {
      const a = poly[k], b = poly[k + 1], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      const di = Math.hypot(mx - q[0], my - q[1]);
      let bj = -1, bd = 1e9;
      for (const j of nb) { const d = Math.abs(Math.hypot(mx - pts[j][0], my - pts[j][1]) - di); if (d < bd) { bd = d; bj = j; } }
      if (bj > i && bd < 1e-3 * (1 + di)) { eA.push(U.base + i); eB.push(U.base + bj); eSeg.push([a[0], a[1], b[0], b[1]]); }
    }
    for (const j of nb) if (j > i && Math.hypot(pts[j][0] - q[0], pts[j][1] - q[1]) < med * 2.7) adj.push([U.base + i, U.base + j]);
  });
}
// border segments between units, with the cell on each side
G.borders.forEach(([ua, ub, pts]) => {
  const A1 = units[ua], B1 = units[ub];
  const pp = pts.map(P);
  for (let k = 0; k < pp.length - 1; k++) {
    const mx = (pp[k][0] + pp[k + 1][0]) / 2, my = (pp[k][1] + pp[k + 1][1]) / 2;
    const ca = A1 && A1.del ? A1.base + A1.del.find(mx, my) : -1 - (A1 ? Object.keys(units).indexOf(ua) : 0);
    const cb = B1 && B1.del ? B1.base + B1.del.find(mx, my) : -1;
    if (ca < 0 || cb < 0) continue;
    eA.push(ca); eB.push(cb); eSeg.push([pp[k][0], pp[k][1], pp[k + 1][0], pp[k + 1][1]]);
    if (k % 3 === 0) adj.push([ca, cb]);
  }
});

// ============================================================ zones → member cells (computed once)
const ZONES = A.zones;
const pip = (x, y, r) => { let c = false; for (let i = 0, j = r.length - 1; i < r.length; j = i++) { const [xi, yi] = r[i], [xj, yj] = r[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
A.manchukuoZone.p = G.manchukuo;
A.sovietManchuria.p = G.manchukuo;
ZONES.forEach((z, zi) => {
  z.d0 = toDay(z.from); z.d1 = toDay(z.to); z.i = zi;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  z.p.forEach(([x, y]) => { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; });
  z.cells = [];
  z.w.forEach(u => {
    const U = units[u]; if (!U) return;
    U.cells.forEach(ci => { const c = cells[ci]; if (c.lon >= x0 && c.lon <= x1 && c.lat >= y0 && c.lat <= y1 && pip(c.lon, c.lat, z.p)) z.cells.push(ci); });
  });
});
const SKEYS = Object.keys(A.status);
const SIDX = {}; SKEYS.forEach((k, i) => SIDX[k] = i);
const FAC = {}; A.factions.forEach(f => f.s.forEach(s => FAC[s] = f.k));
const unitBaseAt = (u, day) => { const b = A.base[u]; if (!b) return 'neu'; let s = b[0][1]; for (const [d, v] of b) if (toDay(d) <= day) s = v; return s; };
const prewar = {}; for (const u in units) prewar[u] = A.base[u] ? A.base[u][0][1] : 'neu';
const wars = A.wars.map(w => ({ a: new Set(w[0]), b: new Set(w[1]), d0: toDay(w[2]), d1: toDay(w[3]) }));
function hostile(s1, s2, day) {
  if (s1 === s2) return false;
  for (const w of wars) if (day >= w.d0 && day < w.d1 && ((w.a.has(s1) && w.b.has(s2)) || (w.a.has(s2) && w.b.has(s1)))) return true;
  return false;
}
const atWar = (s, day) => wars.some(w => day >= w.d0 && day < w.d1 && (w.a.has(s) || w.b.has(s)));

// ============================================================ state for a given day (cached)
const cache = new Map();
function stateFor(day) {
  const active = ZONES.filter(z => day >= z.d0 && day < z.d1);
  const baseKey = Object.keys(units).map(u => unitBaseAt(u, day)).join(',');
  const warKey = wars.map(w => (day >= w.d0 && day < w.d1 ? 1 : 0)).join('');
  const key = active.map(z => z.i).join(',') + '|' + baseKey + '|' + warKey;
  if (cache.has(key)) return cache.get(key);
  const S = new Array(cells.length), Zi = new Int16Array(cells.length).fill(-1);
  const ubase = {};
  for (const u in units) { ubase[u] = unitBaseAt(u, day); units[u].cells.forEach(ci => { S[ci] = ubase[u]; }); }
  active.forEach(z => z.cells.forEach(ci => { S[ci] = z.s; Zi[ci] = z.i; }));
  // fills per unit
  const fills = {};
  for (const u in units) {
    const U = units[u];
    const groups = {}, hatch = new Path2D(); let anyH = false;
    U.cells.forEach(ci => {
      const s = S[ci]; const poly = cells[ci].poly; if (!poly.length) return;
      const g = groups[s] || (groups[s] = new Path2D());
      g.moveTo(poly[0][0], poly[0][1]); for (let k = 1; k < poly.length; k++) g.lineTo(poly[k][0], poly[k][1]); g.closePath();
      if (s !== prewar[u] && FAC[s] !== FAC[prewar[u]] && s !== 'ccp' && s !== 'mnk' && s !== 'mjg') {
        hatch.moveTo(poly[0][0], poly[0][1]); for (let k = 1; k < poly.length; k++) hatch.lineTo(poly[k][0], poly[k][1]); hatch.closePath(); anyH = true;
      }
    });
    const ks = Object.keys(groups);
    fills[u] = { uniform: ks.length <= 1 ? (ks[0] || ubase[u]) : null, groups, hatch: anyH ? hatch : null };
  }
  // control boundaries & fronts
  const edges = {};   // key: unit id, or '' for borders between units
  for (let k = 0; k < eA.length; k++) {
    const a = S[eA[k]], b = S[eB[k]];

  for (let y = 1938; y <= 1945; y++) { const s = document.createElement('span'); s.style.left = (toDay(y + '-01-01') / NDAYS * 100) + '%'; s.textContent = y; yrs.append(s); }
  const ev = document.getElementById('tlevts'); ev.innerHTML = '';
  A.events.forEach(e => { const t = document.createElement('div'); t.className = 'tl-evt' + (e.major ? ' major' : ''); t.style.left = (e.day / NDAYS * 100) + '%'; t.dataset.d = e.day; ev.append(t); });
}
function renderTimeline() {
  const pct = st.day / NDAYS * 100;
  document.getElementById('tlfill').style.width = pct + '%';
  document.getElementById('tlthumb').style.left = pct + '%';
  slider.value = st.day; slider.setAttribute('aria-valuetext', L().full(toDate(st.day)));
  document.querySelectorAll('.tl-evt').forEach(t => t.classList.toggle('done', +t.dataset.d <= st.day));
}
function setDay(n, fromPlay) {
  const prev = st.day;
  st.day = Math.max(0, Math.min(NDAYS, Math.round(n)));
  if (fromPlay) {
    const crossed = A.events.filter(e => e.major && e.day > prev && e.day <= st.day);
    if (crossed.length) {
      if (document.getElementById('ly-toasts').checked) crossed.forEach(toast);
      if (document.getElementById('ly-pause').checked) { stop(); openNews(crossed[crossed.length - 1], true); return; }
    }
  }
  renderText(); renderTimeline(); redraw();
}
slider.addEventListener('input', () => { stop(); setDay(+slider.value); });
const tlmain = document.getElementById('tlmain'), hov = document.getElementById('tlhover');
tlmain.addEventListener('pointermove', (ev) => { const m = tlmain.getBoundingClientRect(); const f = Math.max(0, Math.min(1, (ev.clientX - m.left) / m.width)); hov.hidden = false; hov.style.left = (f * 100) + '%'; hov.textContent = L().short(toDate(Math.round(f * NDAYS))); });
tlmain.addEventListener('pointerleave', () => { hov.hidden = true; });
const SPEEDS = [0, 3, 8, 18, 40, 90];
const pips = document.getElementById('pips');
for (let i = 1; i <= 5; i++) { const b = document.createElement('button'); b.setAttribute('aria-label', 'Speed ' + i); b.onclick = () => { st.speed = i; markPips(); if (!st.playing) play(); }; pips.append(b); }
function markPips() { [...pips.children].forEach((b, i) => b.classList.toggle('on', i < st.speed)); }
let raf = 0, last = 0, acc = 0;
function play() {
  if (st.day >= NDAYS) setDay(0);
  st.playing = true; last = 0; acc = st.day; setPlayIcon();
  const loop = (ts) => {
    if (!st.playing) return;
    const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0; last = ts;
    acc += dt * SPEEDS[st.speed];
    if (acc >= NDAYS) { setDay(NDAYS, true); stop(); return; }
    if (Math.floor(acc) !== st.day) setDay(Math.floor(acc), true);
    if (st.playing) raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
}
function stop() { st.playing = false; cancelAnimationFrame(raf); setPlayIcon(); }
function setPlayIcon() {
  document.getElementById('playIco').innerHTML = st.playing ? '<path d="M4 2.5h3v11H4zM9 2.5h3v11H9z" fill="currentColor"/>' : '<path d="M4 2.5v11L13.5 8Z" fill="currentColor"/>';
}
document.getElementById('play').onclick = () => (st.playing ? stop() : play());
document.addEventListener('keydown', (ev) => {
  if (ev.target.tagName === 'INPUT' && ev.target.type !== 'range' && ev.target.type !== 'checkbox') return;
  if (ev.key === ' ' && ev.target.tagName !== 'BUTTON') { ev.preventDefault(); st.playing ? stop() : play(); }
  else if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') {
    if (ev.target === slider && !ev.shiftKey) return;
    ev.preventDefault(); const dir = ev.key === 'ArrowRight' ? 1 : -1;
    if (ev.shiftKey) { stop(); setDay(st.day + dir * 30); } else stepEvent(dir);
  } else if (/^[1-5]$/.test(ev.key)) { st.speed = +ev.key; markPips(); }
  else if (ev.key === 'Escape') { closeNews(); closeMenus(); }
});

// ============================================================ toolbar
const layer = { front: true, arrows: true, events: true, names: true, cities: true, grid: true, prov: true, rivers: true };
['front', 'arrows', 'events', 'names', 'cities', 'grid', 'prov', 'rivers'].forEach(k => document.getElementById('ly-' + k).addEventListener('change', (e) => { layer[k] = e.target.checked; redraw(); }));
function setLang(l) { st.lang = l; try { localStorage.setItem('pa-lang', l); } catch (e) { /* storage unavailable */ } renderStatic(); renderTimeline(); }
document.getElementById('lzh').onclick = () => setLang('zh');
document.getElementById('len').onclick = () => setLang('en');
function menuBtn(btnId, menuId) {
  const b = document.getElementById(btnId), m = document.getElementById(menuId);
  b.onclick = (e) => { e.stopPropagation(); const open = m.hidden; closeMenus(); m.hidden = !open; b.setAttribute('aria-expanded', open); };
}
function closeMenus() { ['viewMenu', 'layMenu'].forEach(id => { document.getElementById(id).hidden = true; }); ['viewBtn', 'layBtn'].forEach(id => document.getElementById(id).setAttribute('aria-expanded', 'false')); }
menuBtn('viewBtn', 'viewMenu'); menuBtn('layBtn', 'layMenu');
document.addEventListener('click', (e) => { if (!e.target.closest('.menu-wrap')) closeMenus(); });
document.getElementById('oobBtn').onclick = () => { const o = document.getElementById('oob'); o.classList.toggle('open'); document.getElementById('oobBtn').setAttribute('aria-expanded', o.classList.contains('open')); };
document.getElementById('bToggle').onclick = () => { const b = document.getElementById('brief'); b.classList.toggle('open'); document.getElementById('bToggle').setAttribute('aria-expanded', b.classList.contains('open')); document.getElementById('bToggle').textContent = b.classList.contains('open') ? L().less : L().more; };

// ============================================================ boot
let rt = 0;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(resize, 120); });
buildTimeline(); markPips();
const h = (location.hash || '').slice(1);
if (/^\d{4}-\d{2}-\d{2}$/.test(h)) st.day = Math.max(0, Math.min(NDAYS, toDay(h)));
resize();
fitView(VW < 900 ? [[100, 15], [130, 45]] : A.views[0].b, 0);
renderStatic(); renderTimeline();
const ev0 = A.events.find(e => e.id === h); if (ev0) openNews(ev0, true);
document.getElementById('loading').remove();
window.__pa = { setDay, fitView, stateFor, cells, units, ZONES, flyTo, draw, cache };
})();
</script>
